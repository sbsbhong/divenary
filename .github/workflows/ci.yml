name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn mobile:typecheck
      - run: yarn mobile:test --ci
      - run: yarn mobile:lint
      - run: yarn watch:ui:check
      - run: yarn supabase:unit
      - run: yarn workspace @repo/supabase typecheck
